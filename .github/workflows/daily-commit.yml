name: Daily public export

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make script executable
        run: |
          chmod +x tools/make_public_zip.sh

      - name: Create public export
        run: |
          tools/make_public_zip.sh

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-export-${{ github.sha }}
          path: public_export_*.zip
          retention-days: 14
